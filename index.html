<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trackMePlaying by RodoR</title>
    <link rel="apple-touch-icon" sizes="57x57" href="/assets/favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/assets/favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/assets/favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/assets/favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/assets/favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/assets/favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/assets/favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="/assets/favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/assets/favicon/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/assets/favicon/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
  </head>
  <body>
    <div class="bg-white py-24"> <!-- Main Container -->

      <div class="mx-auto max-w-7xl px-6 lg:px-8"> 
        <!-- Title -->
          <p class="mt-2 font-bold text-5xl text-sky-900 text-center">
            <a href="/">trackMePlaying</a>
          </p>
          <h3 class="text-base font-semibold text-center leading-7 text-sky-600 pb-45">by RodoR</h3> 
          
          <!-- Search -->
          <form class="w-full mx-auto mb-5">   
            <label for="default-search" class="mb-2 text-sm font-medium text-black sr-only dark:text-black">Search</label>
            <div class="relative w-full mt-10">
                <input type="search" id="default-search" class="block w-full p-4 text-sm text-black border border-gray-200 rounded-lg bg-gray-50 focus:ring-sky-500 focus:border-sky-500 dark:border-gray-500 dark:placeholder-gray-400 dark:text-black dark:focus:ring-sky-500 dark:focus:border-sky-500" placeholder="Search your game..." required />
                 <div id="spinner" class="absolute inset-y-0 right-8 flex items-center pr-3">
                    <div class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-solid border-current border-l-transparent text-indigo-500 motion-reduce:animate-[spin_1.5s_linear_infinite]"></div>
                </div>
            </div>
            <div id="suggestedBox" class="container mx-auto border border-gray-200 p-5"><!-- suggested results --></div>
        </form>
          
          <!-- app root -->
          <div id="app" class="py-5"></div>
          <!-- end app root -->
 
          <div id="button-container"><button id="loadMore" class="hidden text-white bg-sky-700 hover:bg-sky-800 focus:ring-4 focus:outline-none focus:ring-sky-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-sky-600 dark:hover:bg-sky-700 dark:focus:ring-sky-800">Cargar más</button></div>


      </div>
    
    </div><!-- Main Container -->


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
